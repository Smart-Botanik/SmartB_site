<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="100%" height="100%">
  <defs>
    <linearGradient id="growing-leaf-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="growing-leaf-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="growing-pot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <radialGradient id="growing-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Soft Glow Base -->
  <circle cx="48" cy="48" r="40" fill="url(#growing-glow)" />

  <!-- Pot Base -->
  <path d="M30 64 L34 82 C34.5 84 36.5 85.5 38.5 85.5 L57.5 85.5 C59.5 85.5 61.5 84 62 82 L66 64 Z" 
        fill="url(#growing-pot)" stroke="#34D399" stroke-width="1.5" stroke-linejoin="round" />
  <rect x="27" y="58" width="42" height="7" rx="3" fill="#10B981" opacity="0.9" />

  <!-- Soil / Substrate Mound -->
  <ellipse cx="48" cy="58" rx="18" ry="4" fill="#047857" />

  <!-- Main Sprout Stem -->
  <path d="M48 58 Q48 38 48 18" stroke="#A7F3D0" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Large Left Leaf -->
  <path d="M48 42 C24 38 14 18 30 14 C44 14 46 34 48 42 Z" fill="url(#growing-leaf-main)" />
  <path d="M48 42 Q36 30 30 14" stroke="#A7F3D0" stroke-width="1" fill="none" opacity="0.6" />

  <!-- Right Leaf -->
  <path d="M48 32 C68 26 78 8 64 6 C50 6 49 24 48 32 Z" fill="url(#growing-leaf-secondary)" />
  <path d="M48 32 Q58 20 64 6" stroke="#ECFDF5" stroke-width="1" fill="none" opacity="0.6" />

  <!-- Top Unfolding Bud -->
  <path d="M48 18 C42 10 48 4 48 4 C48 4 54 10 48 18 Z" fill="#6EE7B7" />

  <!-- Sun Rays / Light Droplet Particles -->
  <circle cx="20" cy="22" r="2" fill="#6EE7B7" opacity="0.8" />
  <circle cx="76" cy="28" r="2.5" fill="#A7F3D0" opacity="0.9" />
  <circle cx="68" cy="48" r="1.5" fill="#34D399" opacity="0.7" />
  <path d="M22 46 Q20 42 22 40 Q24 42 22 46 Z" fill="#38BDF8" opacity="0.8" />
</svg>
