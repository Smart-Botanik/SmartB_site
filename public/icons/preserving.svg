<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="100%" height="100%">
  <defs>
    <linearGradient id="jar-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="jar-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="lid-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <radialGradient id="jar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="48" cy="52" r="38" fill="url(#jar-glow)" />

  <!-- Glass Jar Body Background -->
  <path d="M26 32 C26 28 32 28 32 28 L64 28 C64 28 70 28 70 32 L72 78 C72 84 66 88 58 88 L38 88 C30 88 24 84 24 78 Z" 
        fill="url(#jar-glass)" stroke="#F59E0B" stroke-width="2" />

  <!-- Preserved Contents Inside Jar -->
  <!-- Pickles / Cucumber slices inside -->
  <rect x="32" y="42" width="14" height="32" rx="7" fill="#10B981" transform="rotate(-10 39 58)" opacity="0.9" />
  <rect x="50" y="44" width="14" height="30" rx="7" fill="#059669" transform="rotate(12 57 59)" opacity="0.9" />
  <!-- Small Tomato / Spice sphere -->
  <circle cx="48" cy="74" r="7" fill="#EF4444" opacity="0.85" />
  <circle cx="36" cy="76" r="3" fill="#FDE68A" opacity="0.9" />
  <circle cx="60" cy="76" r="3" fill="#FDE68A" opacity="0.9" />

  <!-- Dill Herb Branch -->
  <path d="M48 38 Q48 56 42 66" stroke="#A7F3D0" stroke-width="1.5" fill="none" opacity="0.8" />

  <!-- Jar Metallic Lid & Ring -->
  <rect x="28" y="16" width="40" height="8" rx="3" fill="url(#lid-gold)" stroke="#B45309" stroke-width="1.5" />
  <rect x="30" y="24" width="36" height="4" rx="1" fill="#F59E0B" />

  <!-- Lid Ribbon / Tag string -->
  <path d="M30 26 C22 30 18 36 22 42" stroke="#FDE68A" stroke-width="1.5" fill="none" stroke-dasharray="2 2" />
  <circle cx="22" cy="42" r="3" fill="#F59E0B" />

  <!-- Glass Shine / Reflection Highlights -->
  <path d="M30 34 L28 76" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M34 34 L33 50" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.4" />
</svg>
