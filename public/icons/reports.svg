<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="100%" height="100%">
  <defs>
    <linearGradient id="report-board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <linearGradient id="report-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <linearGradient id="report-chart" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <radialGradient id="report-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="48" cy="48" r="40" fill="url(#report-glow)" />

  <!-- Clipboard / Tablet Base Frame -->
  <rect x="20" y="16" width="56" height="70" rx="8" fill="url(#report-board)" stroke="#2DD4BF" stroke-width="2" />

  <!-- Clipboard Metal Top Clip -->
  <rect x="36" y="10" width="24" height="10" rx="3" fill="#2DD4BF" />
  <circle cx="48" cy="14" r="2" fill="#022C22" />

  <!-- Inner Screen / Paper Area -->
  <rect x="26" y="24" width="44" height="56" rx="4" fill="url(#report-screen)" />

  <!-- Metric Bar Chart Columns -->
  <rect x="30" y="58" width="6" height="16" rx="2" fill="#059669" />
  <rect x="39" y="50" width="6" height="24" rx="2" fill="#10B981" />
  <rect x="48" y="44" width="6" height="30" rx="2" fill="#2DD4BF" />
  <rect x="57" y="34" width="6" height="40" rx="2" fill="#38BDF8" />

  <!-- Rising Growth Line + Trend Points -->
  <path d="M33 56 L42 46 L51 40 L60 30" stroke="url(#report-chart)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="33" cy="56" r="2.5" fill="#34D399" />
  <circle cx="42" cy="46" r="2.5" fill="#2DD4BF" />
  <circle cx="51" cy="40" r="2.5" fill="#38BDF8" />
  <circle cx="60" cy="30" r="3" fill="#E0F2FE" />

  <!-- Sprout Badge in Top Right Corner of Paper -->
  <g transform="translate(56, 26)">
    <circle cx="6" cy="6" r="6" fill="#10B981" />
    <path d="M6 9 C6 5 4 3 2 4 C1 6 3 9 6 9 Z" fill="#A7F3D0" />
    <path d="M6 9 C6 5 8 3 10 4 C11 6 9 9 6 9 Z" fill="#6EE7B7" />
  </g>
</svg>
