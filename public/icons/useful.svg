<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="100%" height="100%">
  <defs>
    <linearGradient id="useful-bulb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="useful-sprout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <radialGradient id="useful-glow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Light Emission -->
  <circle cx="48" cy="42" r="40" fill="url(#useful-glow)" />

  <!-- Bulb Outer Shape -->
  <path d="M48 14 C33 14 24 25 24 38 C24 48 32 55 36 62 L60 62 C64 55 72 48 72 38 C72 25 63 14 48 14 Z" 
        fill="url(#useful-bulb)" opacity="0.95" stroke="#F59E0B" stroke-width="1.5" />

  <!-- Screw Base of Bulb -->
  <path d="M38 66 L58 66" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
  <path d="M40 72 L56 72" stroke="#B45309" stroke-width="3" stroke-linecap="round" />
  <path d="M43 78 L53 78" stroke="#78350F" stroke-width="3" stroke-linecap="round" />

  <!-- Plant Sprout inside the Bulb Filament -->
  <!-- Stem -->
  <path d="M48 56 Q48 42 48 28" stroke="#047857" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Left Leaf -->
  <path d="M48 42 C32 38 28 26 40 28 C46 29 47 38 48 42 Z" fill="url(#useful-sprout)" />
  <!-- Right Leaf -->
  <path d="M48 36 C64 32 68 20 56 22 C50 23 49 32 48 36 Z" fill="#34D399" />
  <!-- Top Spark Sprout -->
  <circle cx="48" cy="24" r="3" fill="#A7F3D0" />

  <!-- Idea Rays Radiating Outward -->
  <line x1="48" y1="4" x2="48" y2="8" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="14" x2="24" y2="18" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />
  <line x1="76" y1="14" x2="72" y2="18" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />
  <line x1="10" y1="38" x2="16" y2="38" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />
  <line x1="86" y1="38" x2="80" y2="38" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />

  <!-- Sparkle Dots -->
  <circle cx="26" cy="54" r="2" fill="#A7F3D0" />
  <circle cx="70" cy="54" r="2" fill="#FDE68A" />
</svg>
